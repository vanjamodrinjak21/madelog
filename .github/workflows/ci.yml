name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      # git2 links against OpenSSL on Linux; libsqlite3-sys and libgit2-sys build C sources.
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libssl-dev
        working-directory: .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: madelog
          POSTGRES_PASSWORD: madelog
          POSTGRES_DB: madelog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madelog -d madelog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://madelog:madelog@localhost:5432/madelog?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/db/' || true)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  landing:
    name: landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - name: Report a missing lockfile
        if: hashFiles('landing/pnpm-lock.yaml') == ''
        run: echo "landing/pnpm-lock.yaml does not exist yet; skipping the landing checks."

      - name: Install pnpm
        if: hashFiles('landing/pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node
        if: hashFiles('landing/pnpm-lock.yaml') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        if: hashFiles('landing/pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: hashFiles('landing/pnpm-lock.yaml') != ''
        run: pnpm lint

      - name: Types
        if: hashFiles('landing/pnpm-lock.yaml') != ''
        run: pnpm exec tsc --noEmit

      - name: Build
        if: hashFiles('landing/pnpm-lock.yaml') != ''
        run: pnpm build
