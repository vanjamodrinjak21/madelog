[package]
name = "madelog"
version = "0.1.4"
edition = "2021"
rust-version = "1.75"
description = "Record how your project came together, and prove it."
license = "MIT"
repository = "https://github.com/vanjamodrinjak21/madelog"

# This crate is standalone; the repository root is not a cargo workspace.
[workspace]

[lib]
name = "madelog"
path = "src/lib.rs"

[[bin]]
name = "madelog"
path = "src/main.rs"

[features]
# Build OpenSSL from source instead of linking the system one. Release
# builds use it so one binary runs on every Linux a person might have.
vendored-openssl = ["git2/vendored-openssl"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
git2 = "0.19"
hex = "0.4"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v7", "serde"] }
tera = { version = "1", default-features = false }
ratatui = "0.29"
crossterm = "0.28"
